name: Mobile CI

# Validates the Expo React Native Android application whenever
# mobile files change. Ensures type safety, configuration validity,
# and that no build-breaking regressions are introduced.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit
